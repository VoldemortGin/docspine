# CI: lint + test the Rust workspace, then build the Python extension and run the
# pytest suite. ocrspine is a GIT dependency (see [workspace.dependencies]); the
# runner does NOT need a sibling ocrspine checkout — cargo fetches it. For the OCR
# pytest leg, the PP-OCRv5 models are resolved at runtime: ocrspine's build script
# bakes its own `CARGO_MANIFEST_DIR/models` as the fallback, which on a CI runner
# is the cargo git checkout of ocrspine (models are committed there), so OCR works
# offline with no extra setup.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test (lib crates + features)
        # py-bindings can't standalone-link (extension-module); exclude it from the
        # plain `cargo test` and type-check it separately instead.
        run: |
          cargo test -p doc-core -p doc-parse -p doc-ocr -p doc-render --all-features
          cargo check -p py-bindings --features ocr,legacy-doc,pdf

  python:
    name: python (pip install -e + pytest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Build + install (editable, with test extra)
        # `pip install -e` goes through the maturin PEP 517/660 backend, which needs
        # no virtualenv (unlike `maturin develop`, which fails on setup-python's
        # system interpreter with "Couldn't find a virtualenv"). Features (ocr, pdf)
        # come from [tool.maturin] in pyproject.toml. The `test` extra brings pytest
        # + pdfspine (fitz-compatible reader for the PDF-export read-back gate,
        # python/tests/test_pdf_export.py; abi3 wheels exist for all three runners).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: pytest
        # OCR models resolve from ocrspine's cargo git checkout via the build-time
        # fallback; no OCRSPINE_MODELS needed. Parsing tests need no models at all.
        # -ra prints every skip reason so a silently skipped gate is visible.
        run: python -m pytest python/tests -q -ra
      - name: ssim self-ref gate (C-10 layer 4)
        # Committed deterministic baseline (conformance/ssimref/*.pdf) vs a fresh
        # deterministic re-render, both rasterized by the runner's pdfspine (so the
        # gate is raster-version-independent). A real layout regression drops SSIM
        # below 0.97. Single-OS: the render is bundled-font deterministic, so one
        # runner suffices. NOT the LibreOffice oracle (that stays local-only).
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        env:
          DOCSPINE_DETERMINISTIC_FONTS: "1"
        run: python scripts/ssim_selfref.py --min-ssim 0.97
